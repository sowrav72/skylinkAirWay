<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyWing — Airline Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      :root {
        --boot-ink: #f5f7fb;
        --boot-body: #334155;
        --boot-rail: #edf2f9;
        --boot-line: #d1dbe8;
      }
      html[data-theme='dark'] {
        --boot-ink: #0b1120;
        --boot-body: #d1d5db;
        --boot-rail: #111827;
        --boot-line: #374151;
      }
      body { margin: 0; background: var(--boot-ink); color: var(--boot-body); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--boot-rail); }
      ::-webkit-scrollbar-thumb { background: var(--boot-line); border-radius: 3px; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sw_theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
